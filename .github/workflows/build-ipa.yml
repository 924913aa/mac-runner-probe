name: build ipa

on:
  push:
    branches: [build130]
    paths: ['.github/workflows/build-ipa.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 240
    env:
      FLUTTER_VERSION: 3.47.7
      FLUTTER_SHA256: dd9da574c3168460550117eb0e8dd0313ae934fabf64a82a6d557fff5fd1422e
      RUST_VERSION: 1.99.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 构建（Flutter → Rust → 引擎 → 编译）
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/build.log"
          : > "$LOG"
          {
            set -x
            date -u
            uname -a
            sw_vers || true
            xcodebuild -version || true
            ls /Applications | grep -i xcode || true
            python3 -V

            echo "===== flutter ====="
            curl -fsSL -o "$RUNNER_TEMP/flutter.zip" \
              "https://storage.googleapis.com/flutter_infra_release/releases/stable/macos/flutter_macos_arm64_${FLUTTER_VERSION}-stable.zip"
            echo "$FLUTTER_SHA256  $RUNNER_TEMP/flutter.zip" | shasum -a 256 -c -
            unzip -q "$RUNNER_TEMP/flutter.zip" -d "$RUNNER_TEMP"
            export PATH="$RUNNER_TEMP/flutter/bin:$PATH"
            echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
            flutter --version

            echo "===== rust ====="
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            rustup toolchain install "$RUST_VERSION" --profile minimal
            for target in aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
              rustup target add --toolchain "$RUST_VERSION" "$target"
            done
            cargo --version

            echo "===== engine ====="
            bash tooling/ios/prepare-engine.sh
            ls -la app/ios/Engine | head -20

            echo "===== compile ====="
            cd app
            python3 tool/l10n_merge.py
            flutter pub get --enforce-lockfile
            flutter gen-l10n
            bash ../tooling/ios/build.sh --release --no-codesign
          } 2>&1 | tee -a "$LOG"

      - name: 打包并推回分支
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          PUB="$RUNNER_TEMP/publish"
          rm -rf "$PUB"; mkdir -p "$PUB"
          APP="app/build/ios/iphoneos/Runner.app"
          IPA="$RUNNER_TEMP/DSH-host-1.3.0-unsigned.ipa"

          if [ -d "$APP" ]; then
            echo "OK" > "$PUB/STATUS.txt"
            { echo "built_at=$(date -u +%FT%TZ)"; echo "commit=$GITHUB_SHA"; } >> "$PUB/STATUS.txt"
            PKG="$RUNNER_TEMP/package"; rm -rf "$PKG"; mkdir -p "$PKG/Payload"
            cp -R "$APP" "$PKG/Payload/Runner.app"
            ( cd "$PKG" && zip -qry "$IPA" Payload )
            shasum -a 256 "$IPA" | cut -d' ' -f1 > "$PUB/ipa.sha256"
            split -b 40m "$IPA" "$PUB/ipa.part-"
            ( cd "$PUB" && shasum -a 256 ipa.part-* > parts.sha256 )
            ls -l "$PUB" >> "$PUB/STATUS.txt"
          else
            echo "FAILED: no Runner.app" > "$PUB/STATUS.txt"
            { echo "== 最后 15 行日志"; tail -15 "$RUNNER_TEMP/build.log"; } > "$PUB/last-lines.txt"
            tail -8 "$RUNNER_TEMP/build.log" | sed -e 's/%/%25/g' -e 's/^/::error::/' || true
          fi
          if [ -s "$RUNNER_TEMP/build.log" ]; then
            tail -c 800000 "$RUNNER_TEMP/build.log" > "$PUB/build.log"
          else
            echo "(no build log)" > "$PUB/build.log"
          fi

          cd "$PUB"
          git init -q
          git checkout -q -b ipa-build
          git add -A
          git -c user.name="ipa-bot" -c user.email="ipa-bot@users.noreply.github.com" \
            commit -q -m "build $GITHUB_RUN_ID: $(head -1 STATUS.txt)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:refs/heads/ipa-build
